[project]
name = "team"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # Pinned EXACT: an open range lets any future release install
    # silently on the next rebuild. Docker consumes only the committed lock via `uv sync --frozen`.
    "docker==7.1.0",
    # Team reads requests' exceptions directly: docker-py raises them, and no DockerException, on a lost or slow
    # Docker socket. Pinned to the version docker-py already resolves.
    "requests==2.34.2",
    # Ed25519 Supervisor and Routine assertions, and the AES-GCM envelope of private Team state.
    "cryptography==50.0.2",
    # RE2 matches an Action schema `pattern` in time linear in the subject and releases the GIL while it runs.
    "google-re2==1.1.20251105",
    "jsonschema==4.25.1",
    # Team builds the Action schema registry from referencing directly. Pinned to the version jsonschema resolves.
    "referencing==0.37.0",
    # Attachment preparation parses untrusted images and PDFs only inside the networkless helper container; the
    # controller never imports them (ADR-0093).
    "pillow==13.0.0",
    "pypdf==6.21.2",
    # A PDF page's preview is rendered by PDFium (Chromium's PDF engine), built without V8 or XFA, only inside the
    # same helper.
    "pypdfium2==5.14.0",
]

[tool.uv]
package = false
