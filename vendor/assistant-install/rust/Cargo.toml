[package]
name = "assistant-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "The neutral Assistant-install contract v1 in Rust, equal to the reference verifier ../v1/verify.py"

[dependencies]
fancy-regex = { version = "=0.19.2", default-features = false, features = ["std", "unicode"] }
sha2 = "=0.11.0"
strict-json = { path = "../../strict-json" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
