[package]
name = "action-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "Admission and payload validation of Action input and output schemas, shared by Developers, Team, and the Brain"

[dependencies]
# The pins the Developers workspace uses for the same packages, so its lock resolves them identically.
jsonschema = { version = "=0.58.6", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }
regex = { version = "=1.13.1", default-features = false, features = [
    "perf",
    "std",
    "unicode-case",
    "unicode-perl",
] }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std"] }
serde_json = "=1.0.152"
strict-json = { path = "../../vendor/strict-json" }

# The ADR-0123 lints and complexity bound (clippy.toml holds its thresholds).
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

# The crate is its own workspace: the Developers workspace excludes it and depends on it by path.
[workspace]
members = ["."]
