[package]
name = "team-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "cargo-fuzz targets for team-protocol"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
strict-json = { path = "../../../../vendor/strict-json" }
team-protocol = { path = ".." }

[[bin]]
name = "validators"
path = "fuzz_targets/validators.rs"
test = false
doc = false
bench = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# The fuzz crate is its own workspace, so the parent package never builds it.
[workspace]
members = ["."]
