[package]
name = "team-browser-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "cargo-fuzz targets for the Browser task's parser of the Cua Driver's MCP answers"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
team-browser = { path = ".." }
team-core = { path = "../../../core" }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "test-util", "time"] }

[[bin]]
name = "mcp_lines"
path = "fuzz_targets/mcp_lines.rs"
test = false
doc = false
bench = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# The fuzz crate is its own workspace, so the Team workspace never builds it.
[workspace]
members = ["."]
