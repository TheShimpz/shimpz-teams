[package]
name = "team-install"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Team installation: publication resolution, artifact trust, bindings, icons, and updates"

[features]
# A fixed resolver and a scripted verifier, for unit tests and the controller suite's test-only runner; never the
# live artifact-trust lane.
testing = []

[dependencies]
assistant-install.workspace = true
assistant-protocol.workspace = true
base64.workspace = true
rustix.workspace = true
rustls.workspace = true
strict-json.workspace = true
team-assistant.workspace = true
team-core.workspace = true
team-integrations.workspace = true
team-protocol.workspace = true
team-storage.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "time"] }
tokio-rustls.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
