[package]
name = "team-local"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Local Team controller: the shimpz-team binary, its HTTP server, Docker, and lifecycle coordination"

[lib]
name = "team_local"
path = "src/lib.rs"

[[bin]]
name = "shimpz-team"
path = "src/main.rs"

[features]
# In-memory fakes of the controller's seams, for the workspace's tests and the controller suite's test-only runner.
testing = ["team-core/testing", "team-install/testing"]

[dependencies]
aes-gcm.workspace = true
assistant-protocol.workspace = true
base64.workspace = true
bollard.workspace = true
futures-core.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
ring.workspace = true
rusqlite = { workspace = true, features = ["hooks", "serialize"] }
rustix.workspace = true
sha2.workspace = true
strict-json.workspace = true
subtle.workspace = true
team-action.workspace = true
team-assistant.workspace = true
team-browser.workspace = true
team-chat.workspace = true
team-core.workspace = true
team-egress.workspace = true
team-inference.workspace = true
team-install.workspace = true
team-integrations.workspace = true
team-prepare.workspace = true
team-protocol.workspace = true
team-routine.workspace = true
team-storage.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
team-core = { workspace = true, features = ["testing"] }
team-inference = { workspace = true, features = ["testing"] }
team-prepare = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
