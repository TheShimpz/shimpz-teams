[shimpz]
spec = 1
id = "fixture-assistant"
version = "0.1.0"
name = "Fixture Assistant"
summary = "Exercise immutable admission."
description = "Exercise one reviewed Assistant through the Team test suite."
creators = ["@fixture"]
