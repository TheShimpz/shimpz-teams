[package]
name = "team-inference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Team inference: the Brain client, the Brain token, inference settings, Team memory, and usage"

[features]
# A scripted Brain, for the tests of the crates that call the Brain.
testing = []

[dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
sha2.workspace = true
strict-json.workspace = true
team-core.workspace = true
team-protocol.workspace = true
team-storage.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
rustix.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
