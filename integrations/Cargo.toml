[package]
name = "team-integrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Team Integrations: the OAuth broker client, PKCE, challenges, and encrypted credentials"

[features]
# The scripted CONNECT proxy and TLS server of the broker and provider-call tests.
testing = ["dep:rcgen", "team-core/testing"]

[dependencies]
base64.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true, optional = true }
rustls.workspace = true
rustls-native-certs.workspace = true
sha2.workspace = true
strict-json.workspace = true
subtle.workspace = true
team-assistant.workspace = true
team-core.workspace = true
team-protocol.workspace = true
team-storage.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen.workspace = true
team-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
